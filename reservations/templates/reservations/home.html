<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Seat Reservation API service and interactive documentation.">
  <title>Seat Reservation API</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(23 32 51 / 9%);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #2563eb;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.055em;
      line-height: 1.05;
    }
    .intro {
      max-width: 48ch;
      margin: 20px 0 30px;
      color: #526078;
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
    }
    .primary {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
    .primary:hover { background: #1d4ed8; }
    .secondary {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration-color: #cbd5e1;
      text-underline-offset: 4px;
    }
    .primary:focus-visible, .secondary:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Backend API</p>
    <h1>Seat Reservation</h1>
    <p class="intro">
      Explore the API documentation to create shows, check seat availability,
      and make or cancel reservations.
    </p>
    <nav class="links" aria-label="Service links">
      <a class="primary" href="/api/docs/">Open Swagger documentation</a>
      <a class="secondary" href="/api/health/live/">Check service health</a>
      <a class="secondary" href="/metrics">View metrics</a>
    </nav>
  </main>
</body>
</html>
